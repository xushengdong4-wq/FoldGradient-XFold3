plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lucas.foldgradient'
    compileSdk 35

    defaultConfig {
        applicationId 'com.lucas.foldgradient'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '0.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
